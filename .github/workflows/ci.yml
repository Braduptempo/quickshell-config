name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

jobs:
  lint:
    name: Lint (qmldir, qmllint, shellcheck)
    runs-on: ubuntu-latest
    # Arch has the same Quickshell and Qt versions as the desktop
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git quickshell qt6-declarative qt6-multimedia shellcheck
      - uses: actions/checkout@v5
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Lint
        run: bash scripts/ci/lint.sh

  load:
    name: Load test (headless sway)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git quickshell qt6-declarative qt6-multimedia sway dbus libcap ttf-jetbrains-mono
      - name: Drop sway's file capabilities
        # Arch ships sway with cap_sys_nice; containers refuse to run such
        # binaries ("Operation not permitted")
        run: setcap -r "$(command -v sway)"
      - uses: actions/checkout@v5
      - name: Create test user
        # sway refuses to run as root
        run: |
          useradd -m tester
          chown -R tester "$GITHUB_WORKSPACE"
      - name: Load test
        run: |
          runuser -u tester -- env QS_TEST_HEADLESS=1 QS_TEST_SECONDS=10 \
            dbus-run-session -- bash scripts/ci/load-test.sh "$GITHUB_WORKSPACE"
