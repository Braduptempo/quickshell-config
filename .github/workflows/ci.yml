name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

jobs:
  lint:
    name: Lint (qmldir, qmllint, shellcheck)
    runs-on: ubuntu-latest
    # Arch has the same Quickshell and Qt versions as the desktop
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git quickshell qt6-declarative shellcheck
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Lint
        run: bash scripts/ci/lint.sh

  load:
    name: Load test (headless sway)
    runs-on: ubuntu-latest
    container: archlinux:latest
    # New job: may still need tuning for the CI environment,
    # so it does not block merges yet.
    continue-on-error: true
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git quickshell qt6-declarative sway dbus ttf-jetbrains-mono
      - uses: actions/checkout@v4
      - name: Create test user
        # sway refuses to run as root
        run: |
          useradd -m tester
          chown -R tester "$GITHUB_WORKSPACE"
      - name: Load test
        run: |
          runuser -u tester -- env QS_TEST_HEADLESS=1 QS_TEST_SECONDS=10 \
            dbus-run-session -- bash scripts/ci/load-test.sh "$GITHUB_WORKSPACE"
